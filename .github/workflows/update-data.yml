name: Update data

on:
  schedule:
    - cron: '0 6 * * 1' # lunes 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build data
        run: node scripts/build-data.mjs
      - name: Check data
        run: node scripts/check.mjs
      - name: Commit and publish
        run: |
          if git diff --quiet -- data; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Actualiza los datos desde Atlas Academy"
          git push
          # Un push con GITHUB_TOKEN no lanza el build de Pages por sí solo.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
